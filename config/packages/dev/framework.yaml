# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    rate_limiter:
        contact_form:
            policy: 'token_bucket'
            limit: 20
            rate: { interval: '1 minutes', amount: 20 }
            cache_pool: 'cache.contact_form_limiter'
        custom_form:
            policy: 'token_bucket'
            limit: 20
            rate: { interval: '1 minutes', amount: 20 }
            cache_pool: 'cache.custom_form_limiter'
        user_signup:
            policy: 'token_bucket'
            limit: 20
            rate: { interval: '1 minutes', amount: 20 }
            cache_pool: 'cache.user_signup_limiter'
        password_request:
            policy: 'token_bucket'
            limit: 20
            rate: { interval: '1 minutes', amount: 20 }
            cache_pool: 'cache.password_request_limiter'
        # Looser than the bundle-provided defaults, for comfortable manual testing.
        # No "cache_pool" here: inherits the dedicated pool RoadizUserExtension prepends.
        password_request_email:
            policy: 'fixed_window'
            limit: 50
            interval: '1 minute'
        password_reset:
            policy: 'token_bucket'
            limit: 20
            rate: { interval: '1 minutes', amount: 20 }
            cache_pool: 'cache.password_reset_limiter'
        two_factor_login:
            policy: 'token_bucket'
            limit: 20
            rate: { interval: '1 minutes', amount: 20 }
